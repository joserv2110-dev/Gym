<!doctype html>
<html lang="es">
<head>

<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="FitTrack">
<link rel="manifest" href="manifest.webmanifest">

<style>
:root{--fig:#aab4c3;--bg:#0e1116;--card:#171c24;--card2:#1f2631;--tx:#eef2f7;--mu:#8b97a8;--ac:#34d399;--ac2:#10b981;--ac-tx:#052e1f;--wa:#fbbf24;--bad:#f87171;--bl:#60a5fa;--vi:#a78bfa;--bd:#262e3b}
:root[data-theme=light]{--fig:#7b8798;--bg:#f3f5f8;--card:#fff;--card2:#eef1f5;--tx:#0f172a;--mu:#64748b;--ac:#059669;--ac2:#047857;--ac-tx:#fff;--wa:#b45309;--bad:#dc2626;--bl:#2563eb;--vi:#7c3aed;--bd:#e2e8f0}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--fig:#7b8798;--bg:#f3f5f8;--card:#fff;--card2:#eef1f5;--tx:#0f172a;--mu:#64748b;--ac:#059669;--ac2:#047857;--ac-tx:#fff;--wa:#b45309;--bad:#dc2626;--bl:#2563eb;--vi:#7c3aed;--bd:#e2e8f0}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,Segoe UI,Roboto,sans-serif}
body{padding-top:env(safe-area-inset-top)}
#app{max-width:560px;margin:0 auto;padding:0 16px calc(86px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
header h1{font-size:26px;margin:0;letter-spacing:-.5px}
header small{color:var(--mu);display:block;font-size:13px}
h2{font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.8px;margin:22px 0 8px;font-weight:600}
.card{background:var(--card);border-radius:18px;padding:16px;margin:10px 0;border:1px solid var(--bd)}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}.g8{gap:8px}
.mu{color:var(--mu)}.sm{font-size:13px}.big{font-size:30px;font-weight:700;letter-spacing:-1px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 4px;text-align:center;font-size:12.5px;color:var(--tx);cursor:pointer;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tile b{font-size:24px;font-weight:400}.tile:active,.btn:active,.chip:active{transform:scale(.96)}
.btn{background:var(--ac);color:var(--ac-tx);border:0;border-radius:14px;padding:13px 16px;font-size:16px;font-weight:650;width:100%;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--tx)}.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--bd)}
.btn.s{width:auto;padding:9px 14px;font-size:14px;border-radius:12px}
.chip{display:inline-block;background:var(--card2);border:1px solid var(--bd);color:var(--tx);padding:8px 13px;border-radius:999px;font-size:14px;margin:3px 4px 3px 0;cursor:pointer}
.chip.on{background:var(--ac);color:var(--ac-tx);border-color:var(--ac)}
.bar{height:9px;background:var(--card2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:var(--ac);transition:width .4s}
.m{margin:11px 0}.m .row{margin-bottom:5px;font-size:14px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:12px;font-size:17px;font-family:inherit}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav div{display:flex;width:100%;max-width:560px}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:9px 0 8px;font-size:11px;cursor:pointer}
nav button b{display:block;font-size:22px;font-weight:400;line-height:1.1}nav button.on{color:var(--ac)}
#sheetbg{position:fixed;inset:0;background:#0009;display:none;z-index:20;align-items:flex-end;justify-content:center}
#sheetbg.on{display:flex}
#sheet{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;border:1px solid var(--bd)}
#sheet h3{margin:0 0 4px;font-size:20px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
#toast.on{opacity:1}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:8px 2px;border-radius:10px;font-size:13.5px;cursor:pointer}.seg button.on{background:var(--card);color:var(--tx);font-weight:600}
.tip{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14.5px}.tip:last-child{border:0}
.set{display:inline-block;background:var(--card2);padding:5px 10px;border-radius:9px;margin:3px 4px 0 0;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rest{position:sticky;top:0;z-index:5;background:var(--ac);color:var(--ac-tx);text-align:center;border-radius:14px;padding:10px;font-weight:700;margin:8px 0;display:none}.rest.on{display:block}
.hist{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}
.x{background:none;border:0;color:var(--bad);font-size:18px;cursor:pointer}
svg text{fill:var(--mu);font-size:10px}
.hero{background:linear-gradient(135deg,var(--card),var(--card2))}
</style>
</head>
<body>
<div id="app"></div>
<nav><div id="nav"></div></nav>
<div id="sheetbg"><div id="sheet"></div></div>
<div id="toast"></div>
<script>
'use strict';
/* ============ DATOS ============ */
const KEY='fittrack.v1';
let S={perfil:null,logs:[],metas:[],work:null,ajustes:{aviso:false,hora:'18:00',tema:'auto'}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>iso(new Date());
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const days=n=>Array.from({length:n},(_,i)=>addD(today(),i-n+1));
const DN=['dom','lun','mar','mié','jue','vie','sáb'],DNL=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const dow=s=>parse(s).getDay();
const weekStart=s=>addD(s,-((dow(s)+6)%7));
const r0=Math.round,mn=Math.min,mx=Math.max;
const r1=x=>Math.round(x*10)/10;
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function add(type,o={}){const l=Object.assign({id:uid(),d:today(),ts:Date.now(),type},o);S.logs.push(l);save();return l}
const of=(d,t)=>S.logs.filter(l=>l.d===d&&l.type===t);
const sum=(d,t,k)=>of(d,t).reduce((a,l)=>a+(+l[k]||0),0);
const lastOf=(t,before)=>{const a=S.logs.filter(l=>l.type===t&&(!before||l.d<=before)).sort((x,y)=>x.d===y.d?x.ts-y.ts:x.d<y.d?-1:1);return a[a.length-1]};
const firstDate=()=>S.logs.length?S.logs.reduce((m,l)=>l.d<m?l.d:m,today()):today();

/* ============ METAS CALCULADAS ============ */
function goals(){
  const p=S.perfil;if(!p)return{};
  const w=lastOf('peso')?.kg||p.peso;
  const tmb=10*w+6.25*p.estatura-5*p.edad+(p.sexo==='h'?5:-161);
  const tdee=tmb*(1.2+.075*p.dias.length);
  let kcal=p.objetivo==='perder'?tdee*.85:p.objetivo==='ganar'?tdee+250:tdee;
  kcal=r0(mx(kcal,tmb,1200)/10)*10;
  return{tmb:r0(tmb),tdee:r0(tdee),kcal,
    prot:r0(w*(p.objetivo==='perder'||p.objetivo==='ganar'?1.9:1.6)),
    agua:r0(w*35/50)*50,
    pasos:{p:6000,i:8000,a:10000}[p.nivel],
    sueno:7.5,
    rate:p.objetivo==='perder'?-.005*w:p.objetivo==='ganar'?.0025*w:0};
}
/* ============ PLAN DE ENTRENO ============ */
const EX={
 push:{gym:['Press banca','Press militar con mancuernas','Press inclinado','Fondos asistidos','Extensión de tríceps en polea'],manc:['Press con mancuernas','Press de hombro','Aperturas','Extensión de tríceps','Elevaciones laterales'],nada:['Flexiones','Flexiones diamante','Flexiones pica','Fondos en silla','Flexiones inclinadas']},
 pull:{gym:['Jalón al pecho','Remo con barra','Remo en polea','Curl de bíceps con barra','Face pull'],manc:['Remo con mancuerna','Curl con mancuernas','Pájaros','Remo inclinado','Curl martillo'],nada:['Remo invertido bajo mesa','Superman','Curl con mochila','Remo con mochila','Dominadas australianas']},
 legs:{gym:['Sentadilla','Prensa de piernas','Peso muerto rumano','Curl femoral','Elevación de talones'],manc:['Sentadilla goblet','Zancadas','Peso muerto rumano con mancuernas','Puente de glúteo con peso','Sentadilla búlgara'],nada:['Sentadilla','Zancadas','Puente de glúteo','Sentadilla búlgara','Elevación de talones']},
 core:{gym:['Plancha','Elevación de piernas','Crunch en polea'],manc:['Plancha','Russian twist','Crunch'],nada:['Plancha','Elevación de piernas','Crunch']}
};
const SPLITS={
 3:[['Cuerpo completo A',['legs','push','pull','core']],['Cuerpo completo B',['pull','legs','push','core']],['Cuerpo completo C',['push','legs','pull','core']]],
 4:[['Torso',['push','pull','push','pull']],['Pierna y core',['legs','legs','legs','core']]],
 5:[['Empuje',['push','push','push','core']],['Tirón',['pull','pull','pull','core']],['Pierna',['legs','legs','legs','core']],['Torso',['push','pull','push','pull']],['Pierna y core',['legs','legs','legs','core']]]
};
const isTime=n=>/^Plancha/.test(n);

/* ---- Rutina por músculos ---- */
const MU={
 pecho:{n:'Pecho',gym:['Press banca','Press inclinado con mancuernas','Aperturas en polea','Fondos asistidos'],manc:['Press con mancuernas','Press inclinado con mancuernas','Aperturas','Pullover'],nada:['Flexiones','Flexiones inclinadas','Flexiones declinadas','Flexiones diamante']},
 espalda:{n:'Espalda',gym:['Jalón al pecho','Remo con barra','Remo en polea','Remo con mancuerna'],manc:['Remo con mancuerna','Remo inclinado','Pullover','Pájaros'],nada:['Remo invertido bajo mesa','Superman','Remo con mochila','Dominadas australianas']},
 hombro:{n:'Hombros',gym:['Press militar con mancuernas','Elevaciones laterales','Pájaros en máquina','Face pull'],manc:['Press de hombro','Elevaciones laterales','Elevaciones frontales','Pájaros'],nada:['Flexiones pica','Flexiones pica con pies elevados','Elevaciones laterales con mochila','Plancha con toque de hombro']},
 biceps:{n:'Bíceps',gym:['Curl de bíceps con barra','Curl con mancuernas','Curl martillo','Curl en polea'],manc:['Curl con mancuernas','Curl martillo','Curl concentrado','Curl alterno'],nada:['Curl con mochila','Curl isométrico con toalla','Remo supino bajo mesa','Curl con banda o mochila lenta']},
 triceps:{n:'Tríceps',gym:['Extensión de tríceps en polea','Press cerrado','Fondos asistidos','Press francés'],manc:['Extensión de tríceps','Patada de tríceps','Press francés con mancuerna','Fondos en silla'],nada:['Fondos en silla','Flexiones diamante','Extensión de tríceps con mochila','Flexiones cerradas']},
 cuadriceps:{n:'Cuádriceps',gym:['Sentadilla','Prensa de piernas','Extensión de cuádriceps','Zancadas'],manc:['Sentadilla goblet','Zancadas','Sentadilla búlgara','Sentadilla con salto'],nada:['Sentadilla','Zancadas','Sentadilla búlgara','Sentadilla con pausa']},
 femoral:{n:'Femoral y glúteo',gym:['Peso muerto rumano','Curl femoral','Hip thrust','Patada de glúteo en polea'],manc:['Peso muerto rumano con mancuernas','Puente de glúteo con peso','Buenos días','Step-up'],nada:['Puente de glúteo','Puente a una pierna','Peso muerto a una pierna','Curl femoral con toalla']},
 core:{n:'Core',gym:['Plancha','Elevación de piernas','Crunch en polea','Rueda abdominal'],manc:['Plancha','Russian twist','Crunch','Elevación de piernas'],nada:['Plancha','Elevación de piernas','Crunch','Bicicleta abdominal']},
 pantorrilla:{n:'Pantorrillas',gym:['Elevación de talones de pie','Elevación de talones sentado'],manc:['Elevación de talones con mancuerna','Elevación a una pierna'],nada:['Elevación de talones','Elevación a una pierna']}
};
const MUORD=['pecho','espalda','cuadriceps','femoral','hombro','biceps','triceps','core','pantorrilla'];
let muSel=[],muShift=0,muRoutine=null;
function muscleRoutine(sel,shift){
  const p=S.perfil,keys=MUORD.filter(k=>sel.includes(k)),N=mx(keys.length,mn(8,mx(3,r0(p.minutos/9))));
  const cnt={};for(let i=0;i<N;i++){const k=keys[i%keys.length];if(cnt[k]<(MU[k][p.equipo].length)||cnt[k]===undefined)cnt[k]=(cnt[k]||0)+1}
  const rr=p.objetivo==='rendimiento'?'5-8':p.objetivo==='perder'?'10-15':'8-12',sets=p.nivel==='p'?2:3,ex=[];
  keys.forEach(k=>{const pool=MU[k][p.equipo];for(let j=0;j<cnt[k];j++){const nm=pool[(j+shift)%pool.length];if(!ex.find(e=>e.n===nm))ex.push({n:nm,series:sets,reps:isTime(nm)?'30-60':rr,done:[]})}});
  return{nombre:keys.map(k=>MU[k].n).join(' + '),ex};
}
function sessionFor(date){
  const p=S.perfil;if(!p)return null;
  const ds=[...p.dias].sort((a,b)=>((a+6)%7)-((b+6)%7));
  const k=ds.indexOf(dow(date));if(k<0)return null;
  const n=ds.length,tpl=n<=3?SPLITS[3]:n===4?SPLITS[4]:SPLITS[5];
  const [name,grps]=tpl[k%tpl.length];
  const N=mn(7,mx(3,r0(p.minutos/9)));
  const count={},list=[];
  for(let i=0;i<N;i++){const g=grps[i%grps.length];const pool=EX[g][p.equipo];const c=count[g]=(count[g]||0);
    const idx=(c+(g==='core'?0:Math.floor(k/(tpl.length>3?1:1))))%pool.length;
    const nm=pool[idx];if(!list.find(e=>e.n===nm))list.push({n:nm});count[g]++}
  const rr=p.objetivo==='rendimiento'?'5-8':p.objetivo==='perder'?'10-15':'8-12';
  const sets=p.nivel==='p'?2:3;
  return{nombre:name,ex:list.map(e=>({n:e.n,series:sets,reps:isTime(e.n)?'30-60':rr,done:[]}))};
}
function lastSets(ej){
  const a=S.logs.filter(l=>l.type==='set'&&l.ej===ej&&l.d<today()).sort((x,y)=>x.ts-y.ts);
  if(!a.length)return null;const d=a[a.length-1].d;return a.filter(l=>l.d===d);
}
function suggest(ex){
  const ls=lastSets(ex.n);if(!ls)return{kg:0,reps:parseInt(ex.reps),txt:'Primera vez: empieza ligero y cuida la técnica.'};
  const top=parseInt(ex.reps.split('-')[1]||ex.reps),kg=mx(...ls.map(l=>l.kg)),best=mx(...ls.map(l=>l.reps));
  const hit=ls.filter(l=>l.reps>=top).length>=mn(ex.series,ls.length);
  const resumen=ls.map(l=>`${l.kg||'PC'}×${l.reps}`).join(' · ');
  if(hit)return{kg:kg>0?r1(kg+2.5):0,reps:kg>0?parseInt(ex.reps):best+1,txt:`Última: ${resumen}. ¡Sube! `+(kg>0?`Prueba ${r1(kg+2.5)} kg.`:`Intenta ${best+1} reps.`)};
  return{kg,reps:mn(top,best+1),txt:`Última: ${resumen}. Mantén ${kg||'tu peso'} y busca +1 rep.`};
}
/* ============ ESTADÍSTICAS ============ */
function dayStats(d){
  const pas=of(d,'pasos'),sl=of(d,'sueno');
  return{agua:sum(d,'agua','ml'),pasos:pas.length?mx(...pas.map(l=>l.n)):0,kcal:sum(d,'comida','kcal'),prot:sum(d,'comida','prot'),
    comidas:of(d,'comida').length,sueno:sl.length?sl[sl.length-1].h:0,calidad:sl.length?sl[sl.length-1].q:0,
    ent:of(d,'sesion').length>0||sum(d,'cardio','min')>=15,min:sum(d,'sesion','min')+sum(d,'cardio','min'),
    cardio:sum(d,'cardio','min'),kcalQ:sum(d,'cardio','kcal')};
}
function score(d){
  const g=goals(),s=dayStats(d),c=[];
  c.push([20,mn(s.agua/g.agua,1)],[20,mn(s.pasos/g.pasos,1)]);
  const comida=.5*mn(s.prot/g.prot,1)+.5*(s.kcal>0?mx(0,1-Math.abs(s.kcal-g.kcal)/(g.kcal*.4)):0);
  c.push([25,comida],[15,mn(s.sueno/g.sueno,1)]);
  if(S.perfil.dias.includes(dow(d))||s.ent)c.push([30,s.ent?1:0]);
  const t=c.reduce((a,x)=>a+x[0],0);return r0(c.reduce((a,x)=>a+x[0]*x[1],0)/t*100);
}
const hasData=d=>S.logs.some(l=>l.d===d);
function streak(){let n=0,d=today();if(!hasData(d)||score(d)<40)d=addD(d,-1);
  while(d>=firstDate()&&hasData(d)&&score(d)>=40){n++;d=addD(d,-1)}return n}
function trend(){ // kg por semana en últimas 3 semanas
  const a=S.logs.filter(l=>l.type==='peso'&&l.d>=addD(today(),-21)).sort((x,y)=>x.ts-y.ts);
  if(a.length<2)return null;const x0=parse(a[0].d),x1=parse(a[a.length-1].d),dd=(x1-x0)/864e5;
  if(dd<5)return null;return(a[a.length-1].kg-a[0].kg)/dd*7;
}
function coach(){
  const p=S.perfil,g=goals(),t=today(),s=dayStats(t),h=new Date().getHours(),tips=[];
  const planned=!!sessionFor(t);
  if(planned&&!s.ent)tips.push(['🏋️',h<18?`Hoy toca <b>${esc(sessionFor(t).nombre)}</b>. Reserva ${p.minutos} min.`:`Aún no entrenas hoy. Incluso 15 min cuentan: ¡hazlo!`]);
  if(s.agua<g.agua*(h>=12?.5:.2)&&h>=10)tips.push(['💧',`Llevas ${s.agua} de ${g.agua} ml. Toma un vaso ahora.`]);
  if(h>=15&&s.pasos<g.pasos*.4)tips.push(['🚶',`Pasos bajos (${s.pasos}). Una caminata de 15 min suma ~1.800.`]);
  if(h>=14&&s.prot<g.prot*.4)tips.push(['🥩',`Proteína ${s.prot}/${g.prot} g. Añade huevos, yogur griego, pollo o atún.`]);
  const prev=of(addD(t,-1),'sueno')[0]||lastOf('sueno');
  if(prev&&prev.h<6.5)tips.push(['😴',`Dormiste ${prev.h} h. Hoy baja la intensidad y acuéstate antes.`]);
  const tr=trend();
  if(tr!==null&&p.objetivo==='perder'){
    if(tr<-.01*(lastOf('peso')?.kg||p.peso))tips.push(['⚠️','Estás perdiendo peso muy rápido. Sube ~150 kcal para conservar músculo.']);
    else if(tr>-.1)tips.push(['📉','Peso estancado 3 semanas. Prueba bajar ~150 kcal o sumar 2.000 pasos/día.']);
  }
  if(tr!==null&&p.objetivo==='ganar'&&tr<.1)tips.push(['📈','Peso sin subir. Añade ~200 kcal y revisa que progreses en cargas.']);
  const w7=days(7),act=w7.filter(d=>of(d,'sesion').length||sum(d,'cardio','min')>=15).length;
  if(dow(t)>=5||dow(t)===0){const meta=p.dias.length;const done=days(7).filter(d=>d>=weekStart(t)&&dayStats(d).ent).length;if(done<meta)tips.push(['🎯',`Esta semana ${done}/${meta} entrenos. Aún llegas.`])}
  if(!lastOf('peso',addD(t,-8))&&lastOf('peso')?.d<addD(t,-7))tips.push(['⚖️','Hace más de una semana que no te pesas. Hazlo mañana en ayunas.']);
  if(!tips.length)tips.push(['✅','Vas muy bien hoy. Mantén el ritmo.']);
  return tips.slice(0,4);
}

function exList(){const all=new Set([...Object.values(EX).flatMap(g=>Object.values(g).flat()),...S.logs.filter(l=>l.type==='set').map(l=>l.ej)]);return`<datalist id="exl">${[...all].map(e=>`<option value="${esc(e)}">`).join('')}</datalist>`}

function startWork(ses){S.work={nombre:ses.nombre,start:Date.now(),ex:ses.ex};save();tab='entreno';render()}
function startRest(s){S.restEnd=Date.now()+s*1000;tickRest()}
function tickRest(){clearInterval(restTimer);const el=$('#rest');if(!el||!S.restEnd)return;
  const f=()=>{const left=Math.ceil((S.restEnd-Date.now())/1000),e=$('#rest');if(!e){clearInterval(restTimer);return}
    if(left<=0){e.classList.remove('on');S.restEnd=0;clearInterval(restTimer);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(x){}toast('⏱️ Descanso terminado');return}
    e.classList.add('on');e.textContent=`⏱️ Descanso ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`};f();restTimer=setInterval(f,500)}
function finish(){
  const w=S.work,sets=w.ex.flatMap(e=>e.done.map(s=>({ej:e.n,...s})));
  if(!sets.length){S.work=null;save();render();return toast('Entreno vacío descartado')}
  const prev={};S.logs.filter(l=>l.type==='set').forEach(l=>{prev[l.ej]=mx(prev[l.ej]||0,l.kg)});const prs=[];
  sets.forEach(s=>{if(s.kg>0&&s.kg>(prev[s.ej]||0)&&prev[s.ej]!==undefined&&!prs.includes(s.ej))prs.push(s.ej);add('set',{ej:s.ej,kg:s.kg,reps:s.reps})});
  const vol=sets.reduce((a,s)=>a+s.kg*s.reps,0),min=mx(1,r0((Date.now()-w.start)/60000));
  add('sesion',{nombre:w.nombre,min,series:sets.length,vol});S.work=null;S.restEnd=0;save();render();
  toast(prs.length?`🏆 ¡Récord en ${prs[0]}! · ${min} min`:`✅ Entreno guardado · ${min} min · ${r0(vol)} kg`);
}
function dl(name,mime,txt){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:mime}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function ics(){
  const p=S.perfil,[hh,mm]=S.ajustes.hora.split(':').map(Number),BY=['SU','MO','TU','WE','TH','FR','SA'],pad=n=>String(n).padStart(2,'0');
  const ev=p.dias.map(d=>{let dt=new Date();dt.setHours(hh,mm,0,0);while(dt.getDay()!==d||dt<new Date())dt.setDate(dt.getDate()+1);
    const f=x=>x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate())+'T'+pad(x.getHours())+pad(x.getMinutes())+'00';const en=new Date(dt.getTime()+p.minutos*60000);
    return`BEGIN:VEVENT\r\nUID:fittrack-${d}@local\r\nDTSTAMP:${f(new Date())}\r\nDTSTART:${f(dt)}\r\nDTEND:${f(en)}\r\nRRULE:FREQ=WEEKLY;BYDAY=${BY[d]}\r\nSUMMARY:🏋️ Entrenamiento FitTrack\r\nBEGIN:VALARM\r\nTRIGGER:-PT30M\r\nACTION:DISPLAY\r\nDESCRIPTION:Hora de entrenar\r\nEND:VALARM\r\nEND:VEVENT`}).join('\r\n');
  dl('fittrack-entrenos.ics','text/calendar','BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//FitTrack//ES\r\n'+ev+'\r\nEND:VCALENDAR');
}

   case'how':case'hown':{const nm=a==='how'?S.work.ex[+x].n:el.dataset.n,ex=animFor(nm);sheet(howSheet(nm,a==='hown'));if(ex)playAnim(ex);break}

  ex.hl.forEach(k=>{if(k==='torso')set.push(...(absEx?['spine_01','pelvis']:['spine_02','spine_03','clavicle_']));else set.push(...(HLJ[k]||[]))});
  const hot=bones.map(b=>set.some(s=>b.name.startsWith(s)||b.name===s)?1:0);
  const mat=new THREE.MeshStandardMaterial({color:col,roughness:.55,metalness:.04});
  mat.onBeforeCompile=sh=>{sh.uniforms.uAct=uAct;
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nattribute float aHL;varying float vHL;').replace('#include <begin_vertex>','#include <begin_vertex>\nvHL=aHL;');
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying float vHL;uniform float uAct;').replace('#include <color_fragment>','#include <color_fragment>\ndiffuseColor.rgb=mix(diffuseColor.rgb,vec3(.94,.27,.27),clamp(vHL*uAct,0.,1.));')};
  const meshes=[];
  J.nodes.forEach((n,i)=>{if(n.mesh===undefined||n.skin===undefined)return;
    J.meshes[n.mesh].primitives.forEach(pr=>{
      const g=new THREE.BufferGeometry(),A=pr.attributes,pos=readAcc(G,A.POSITION),ji=readAcc(G,A.JOINTS_0),jw=readAcc(G,A.WEIGHTS_0),hl=new Float32Array(pos.length/3);
      g.setAttribute('position',new THREE.BufferAttribute(pos,3));if(A.NORMAL!==undefined)g.setAttribute('normal',new THREE.BufferAttribute(readAcc(G,A.NORMAL),3));
      g.setAttribute('skinIndex',new THREE.BufferAttribute(new Uint16Array(ji),4));g.setAttribute('skinWeight',new THREE.BufferAttribute(jw,4));
      for(let v=0;v<hl.length;v++){let s=0;for(let c=0;c<4;c++)s+=jw[v*4+c]*hot[ji[v*4+c]];hl[v]=Math.min(1,s)}
      g.setAttribute('aHL',new THREE.BufferAttribute(hl,1));
      if(pr.indices!==undefined){const ix=readAcc(G,pr.indices);g.setIndex(new THREE.BufferAttribute(ix,1))}
      const m=new THREE.SkinnedMesh(g,mat);m.frustumCulled=false;nodes[i].add(m);meshes.push(m)})});
  rig.updateMatrixWorld(true);
  meshes.forEach(m=>m.bind(skel,m.matrixWorld));
  const B={},rest={};bones.forEach(b=>{B[b.name]=b;const p=new V3(),q=new Q(),s=new V3();b.matrixWorld.decompose(p,q,s);rest[b.name]={p,q}});
  /* orientación y escala */
  const dist=(a,b)=>rest[a].p.distanceTo(rest[b].p),sc=84/(dist('thigh_r','calf_r')+dist('calf_r','foot_r'));
  const fw=rest.ball_r.p.clone().sub(rest.foot_r.p);rig.rotation.y=Math.atan2(fw.z,fw.x);rig.scale.setScalar(sc);rig.updateMatrixWorld(true);
  const S=P=>new V3(P[0]-150,204-P[1],0);
  const rigQ=()=>rig.quaternion;
  function setWorld(name,Qw){const b=B[name];b.parent.updateWorldMatrix(true,false);const pq=b.parent.getWorldQuaternion(new Q());b.quaternion.copy(pq.invert().multiply(Qw));b.updateWorldMatrix(false,false)}

  function follow(name,dq){setWorld(name,dq.clone().multiply(rigQ().clone().multiply(rest[name].q)))}
  const gnd=ex.gnd||['ball_r','ball_l',3],gOff=gnd[2];
  const hn=new V3(),hf=new V3();
  return{rig,pose(Jt,H){
    const dir=(a,b)=>S(b).sub(S(a)).normalize(),pel=B.pelvis;
    rig.position.y=rig.position.y||0;rig.updateMatrixWorld(true);
    pel.parent.updateWorldMatrix(true,false);pel.position.copy(pel.parent.worldToLocal(S(Jt.hip)));
    const dT=dir(Jt.hip,Jt.sho);
    aim('pelvis','spine_01',dT);aim('spine_01','spine_02',dT);aim('spine_02','spine_03',dT);const dq3=aim('spine_03','neck_01',dT);const dqn=aim('neck_01','Head',dT);follow('Head',dqn);
    const dUA=dir(Jt.sho,Jt.elb),dFA=dir(Jt.elb,Jt.hnd);
    ['r','l'].forEach(sd=>{

      const kn=sd==='l'&&Jt.knee2?Jt.knee2:Jt.knee,an=sd==='l'&&Jt.ank2?Jt.ank2:Jt.ank,toe=sd==='l'&&Jt.ank2?[an[0]+Jt.toe[0]-Jt.ank[0],an[1]+Jt.toe[1]-Jt.ank[1]]:Jt.toe;
      aim('thigh_'+sd,'calf_'+sd,dir(Jt.hip,kn));aim('calf_'+sd,'foot_'+sd,dir(kn,an));const ft=aim('foot_'+sd,'ball_'+sd,dir(an,toe));follow('ball_'+sd,ft)});

    B.hand_r.getWorldPosition(hn);B.hand_l.getWorldPosition(hf);H.n.copy(hn);H.f.copy(hf);H.mid.copy(hn).add(hf).multiplyScalar(.5);
  }};
}

function run3D(ex,host,id){
  host.innerHTML='';
  const W=host.clientWidth||340,H3=Math.round(W*.8),lab=document.getElementById('animlab');
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setSize(W,H3);
  const cvs=renderer.domElement;cvs.style.cssText='width:100%;display:block;touch-action:none;border-radius:12px';host.appendChild(cvs);
  const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(34,W/H3,1,2000);
  scene.add(new THREE.HemisphereLight(0xffffff,0x556070,1));const dl=new THREE.DirectionalLight(0xffffff,.85);dl.position.set(160,320,220);scene.add(dl);
  const cs=getComputedStyle(document.documentElement),cv=n=>cs.getPropertyValue(n).trim();
  const fig=cv('--fig')||'#aab4c3',mat=new THREE.MeshStandardMaterial({color:fig,roughness:.55,metalness:.05}),far=new THREE.MeshStandardMaterial({color:new THREE.Color(fig).multiplyScalar(.72),roughness:.6});
  const red=new THREE.MeshStandardMaterial({color:0xef4444,emissive:0x7f1d1d,transparent:true,opacity:.8,depthWrite:false});
  const gear=new THREE.MeshStandardMaterial({color:0x64748b,roughness:.6}),dark=new THREE.MeshStandardMaterial({color:0x334155,roughness:.6}),steel=new THREE.MeshStandardMaterial({color:0x475569,metalness:.3,roughness:.4});
  const CYL=new THREE.CylinderGeometry(1,1,1,18),SPH=new THREE.SphereGeometry(1,16,12),BOX=new THREE.BoxGeometry(1,1,1),UP=new THREE.Vector3(0,1,0);
  const floor=new THREE.Mesh(new THREE.CircleGeometry(190,48),new THREE.MeshStandardMaterial({color:cv('--bd')||'#262e3b',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.5;scene.add(floor);
  const V=(P,z=0)=>new THREE.Vector3(P[0]-150,204-P[1],z);
  const mk=(r,sz,m)=>{const g=new THREE.Group(),c=new THREE.Mesh(CYL,m),a=new THREE.Mesh(SPH,m),b=new THREE.Mesh(SPH,m);g.add(c,a,b);g.userData={r,sz,c,a,b};scene.add(g);return g};
  const put=(g,a,b)=>{const{r,sz,c,a:s1,b:s2}=g.userData,d=b.clone().sub(a),len=Math.max(d.length(),.01);c.position.copy(a).add(b).multiplyScalar(.5);c.quaternion.setFromUnitVectors(UP,d.clone().normalize());c.scale.set(r,len,r*sz);s1.position.copy(a);s2.position.copy(b);s1.scale.set(r,r,r*sz);s2.scale.set(r,r,r*sz)};
  const Hd={n:new THREE.Vector3(),f:new THREE.Vector3(),mid:new THREE.Vector3()};
  /* equipo (usa las manos reales del modelo) */
  const items=S3[ex.id]||[],dyn=[];
  items.forEach(it=>{const k=Array.isArray(it)?it[0]:it;
    if(k==='box'){const[,x,y,w,h,d]=it,m=new THREE.Mesh(BOX,gear);m.scale.set(w,h,d);m.position.set(x-150+w/2,204-(y+h/2),0);scene.add(m)}
    else if(k==='tower'){const[,x,y0]=it,w=26,h=204-y0,m=new THREE.Mesh(BOX,gear);m.scale.set(w,h,40);m.position.set(x-150+w/2,204-(y0+h/2),0);scene.add(m);
      [[y0+14,60],[y0+78,60]].forEach(([y,hh],i)=>{const s=new THREE.Mesh(BOX,i?dark:steel);s.scale.set(18,hh,44);s.position.set(x-150+13,204-(y+hh/2),0);scene.add(s)})}
    else if(k==='cable'){const g=mk(.9,1,steel),bar=new THREE.Mesh(CYL,steel);bar.rotation.x=Math.PI/2;bar.scale.set(2,46,2);scene.add(bar);dyn.push(()=>{put(g,Hd.mid,V([it[1],it[2]]));bar.position.copy(Hd.mid)})}
    else if(k==='dumb'){['n','f'].forEach(s=>{const m=new THREE.Mesh(SPH,steel);m.scale.set(8,8,8);scene.add(m);dyn.push(()=>m.position.copy(Hd[s]))})}
    else if(k==='bar'){const bar=new THREE.Mesh(CYL,steel);bar.rotation.x=Math.PI/2;bar.scale.set(1.8,84,1.8);scene.add(bar);
      const pl=[0,1].map(()=>{const m=new THREE.Mesh(CYL,dark);m.rotation.x=Math.PI/2;m.scale.set(12,4,12);scene.add(m);return m});
      dyn.push(()=>{bar.position.copy(Hd.mid);pl[0].position.copy(Hd.mid).z+=32;pl[1].position.copy(Hd.mid).z-=32})}
  });
  /* figura de respaldo: maniquí simple */
  function buildCapsule(){
    const torso=mk(11,1.5,mat),thN=mk(7,1,mat),shN=mk(5.5,1,mat),thF=mk(7,1,far),shF=mk(5.5,1,far),uaN=mk(4.8,1,mat),faN=mk(4,1,mat),uaF=mk(4.8,1,far),faF=mk(4,1,far),ftN=mk(3.5,1,mat),ftF=mk(3.5,1,far);
    const head=new THREE.Mesh(SPH,mat);head.scale.set(11,12,10);scene.add(head);const ov={};
    const mkov=(k,r,sz)=>{ov[k]=mk(r+1.3,sz,red)},R={th:7,sh:5.5,ua:4.8,fa:4};
    ex.hl.forEach(k=>{if(k==='torso')mkov('torso',11,1.5);else if(k==='l2')mkov('l2a',7,1),mkov('l2b',5.5,1);else{mkov(k+'N',R[k],1);mkov(k+'F',R[k],1)}});
    return{pose(J,Hh){
      put(torso,V(J.hip),V(J.sho));head.position.copy(V(J.head));
      const Hz=8,Sz=15,ank2=J.ank2||J.ank,kn2=J.knee2||J.knee;
      put(thN,V(J.hip,Hz),V(J.knee,Hz));put(shN,V(J.knee,Hz),V(J.ank,Hz));put(ftN,V(J.ank,Hz),V(J.toe,Hz));

      if(ov.thN)put(ov.thN,V(J.hip,Hz),V(J.knee,Hz)),put(ov.thF,V(J.hip,-Hz),V(kn2,-Hz));
      if(ov.shN)put(ov.shN,V(J.knee,Hz),V(J.ank,Hz)),put(ov.shF,V(kn2,-Hz),V(ank2,-Hz));
      if(ov.uaN)put(ov.uaN,V(J.sho,Sz),V(J.elb,Sz)),put(ov.uaF,V(J.sho,-Sz),V(J.elb,-Sz));
      if(ov.faN)put(ov.faN,V(J.elb,Sz),V(J.hnd,Sz)),put(ov.faF,V(J.elb,-Sz),V(J.hnd,-Sz));
      if(ov.l2a)put(ov.l2a,V(J.hip,-Hz),V(kn2,-Hz)),put(ov.l2b,V(kn2,-Hz),V(ank2,-Hz));
      Hd.n.copy(V(J.hnd,Sz));Hd.f.copy(V(J.hnd,-Sz));Hd.mid.copy(V(J.hnd,0));
    }};
  }
  const uAct={value:.3};
  let fig3=null,failed=false;
  let az=.6,el=.2,drag=null,user=false;
  cvs.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];user=true;try{cvs.setPointerCapture(e.pointerId)}catch(x){}});
  cvs.addEventListener('pointermove',e=>{if(!drag)return;az-=(e.clientX-drag[0])*.012;el=Math.min(1.25,Math.max(-.05,el+(e.clientY-drag[1])*.006));drag=[e.clientX,e.clientY]});
  ['pointerup','pointercancel'].forEach(n=>cvs.addEventListener(n,()=>{drag=null}));
  loadModel().then(G=>{if(id!==animId)return;try{fig3=buildSkinned(scene,ex,G,fig,uAct)}catch(e){console.warn(e);fig3=buildCapsule()}}).catch(()=>{if(id===animId)fig3=buildCapsule()});
  const t0=performance.now(),reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  (function f(now){
    if(id!==animId||!document.body.contains(cvs)||!sheetOpen()){renderer.dispose();try{renderer.forceContextLoss()}catch(e){}return}
    const T=(now-t0)/1000,per=ex.static?4:3.6,ph=(T%per)/per,p=reduce?1:.5-.5*Math.cos(2*Math.PI*ph);
    if(fig3){const J=solve(mixPose(ex.A,ex.B,p),ex);red.opacity=.3+.65*p;uAct.value=.35+.6*p;fig3.pose(J,Hd);dyn.forEach(d=>d())}
    const A=user?az:az+.5*Math.sin(T*.45),D=330;cam.position.set(D*Math.sin(A)*Math.cos(el),92+D*Math.sin(el),D*Math.cos(A)*Math.cos(el));cam.lookAt(0,92,0);
    renderer.render(scene,cam);lab.textContent=ph<.5?ex.lab[0]:ex.lab[1];requestAnimationFrame(f);

}

function howSheet(name,back){
  const ex=animFor(name);
  if(!ex)return`<h3>${esc(name)}</h3><p class="mu">Aún no tengo animación para este ejercicio. Busca “${esc(name)}” en un video corto de un entrenador certificado y empieza ligero.</p>`;
  return`<h3>${esc(name)}</h3><div class="mu sm">Músculos: <b style="color:var(--tx)">${ex.m}</b> <span style="color:#ef4444">● en rojo</span></div>
  <div id="modes" style="margin-top:10px"><span class="chip ${mode3?'on':''}" data-act="mode:3d">3D · arrastra para girar</span><span class="chip ${mode3?'':'on'}" data-act="mode:2d">2D</span></div><div class="card" style="padding:6px;margin:6px 0 4px"><div id="anim3" style="min-height:120px"></div><svg id="anim" viewBox="0 -12 300 226" width="100%" role="img" aria-label="Animación del ejercicio ${esc(ex.t)}" style="display:none"></svg></div>
  <div id="animlab" class="sm" style="text-align:center;font-weight:650;color:var(--ac);min-height:20px"></div>
  <h2 style="margin-top:14px">Cómo hacerlo</h2>${ex.cues.map((c,i)=>`<div class="tip"><span>${i+1}</span><span>${c}</span></div>`).join('')}
  <p class="sm mu">Modelo esquemático. Empieza con poco peso y prioriza la técnica.</p>${back?`<button class="btn sec" data-act="sheet:murutina">← Volver a la rutina</button>`:`<button class="btn sec" data-act="close">Cerrar</button>`}`;
}

function urlLogs(){
  const q=new URLSearchParams(location.search);if(!S.perfil||![...q.keys()].length)return;const out=[];
  if(q.has('agua')){add('agua',{ml:+q.get('agua')});out.push('💧 '+q.get('agua')+' ml')}
  if(q.has('pasos')){add('pasos',{n:r0(+q.get('pasos'))});out.push('🚶 '+r0(+q.get('pasos')))}
  if(q.has('sueno')){add('sueno',{h:r1(+q.get('sueno')),q:+q.get('calidad')||4});out.push('😴 '+q.get('sueno')+' h')}
  if(q.has('peso')){add('peso',{kg:r1(+q.get('peso'))});out.push('⚖️ '+q.get('peso'))}
  if(q.has('kcal')){add('comida',{kcal:+q.get('kcal'),prot:+q.get('prot')||0,nota:q.get('nota')||''});out.push('🍽️ '+q.get('kcal'))}
  if(q.has('cardio')){add('cardio',{tipo:q.get('tipo')||'Otro',min:+q.get('cardio'),km:0,kcal:r0(5*(lastOf('peso')?.kg||S.perfil.peso)*+q.get('cardio')/60)});out.push('🏃 '+q.get('cardio')+' min')}
  if(out.length){history.replaceState(null,'',location.pathname);setTimeout(()=>toast('Registrado: '+out.join(' · ')),300)}
}
applyTheme();urlLogs();render();reminders();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
